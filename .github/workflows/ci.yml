name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 防止同一分支重复 push 时重复跑
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package (editable + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest test/ --tb=short -q --no-header

  lint-python:
    name: Lint & Type Check (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff + mypy + package
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e .

      - name: Run ruff check (blocking)
        run: ruff check --output-format=github .

      - name: Run ruff format check (blocking)
        run: ruff format --check .

      - name: Run mypy (blocking)
        run: mypy core/ parsers/ formatforge/ --ignore-missing-imports

  lint-node:
    name: Bundle Syntax Check (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check all bundle JS
        run: |
          for f in packages/dsh-formatforge/index.mjs \
                   packages/dsh-formatforge/lib/client.js \
                   packages/dsh-formatforge/tools/*.mjs \
                   packages/dsh-formatforge/services/*.mjs \
                   packages/dsh-formatforge/http/*.mjs; do
            node --check "$f"
          done
          echo "all bundle files OK"

      - name: Protocol contract — CLI JSON shape (via stubbed runner e2e is local-only;
              here we verify version & formats against the installed Python)
        run: node packages/dsh-formatforge/test-manifest.mjs

  cli-e2e:
    name: CLI End-to-End (protocol JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: version / formats / translate protocol checks
        run: |
          python -m formatforge version | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['data']['name']=='dsh-formatforge'"
          python -m formatforge formats | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['data']['count']>20"
          printf 'hello forge\n' | python -m formatforge translate --stdin-text --format text | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and 'hello forge' in d['data']['content']"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit (static security scan)
        run: |
          bandit -r core/ parsers/ formatforge/ -f github -ll \
            || (echo "::warning::bandit found low/medium issues, human review advised")
