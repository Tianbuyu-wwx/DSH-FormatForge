name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 防止同一分支重复 push 时重复跑
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package (editable + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest test/ --tb=short -q --no-header

  lint-python:
    name: Lint & Type Check (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff + mypy + package
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e .

      - name: Run ruff check (blocking)
        run: ruff check --output-format=github .

      - name: Run ruff format check (blocking)
        run: ruff format --check .

      - name: Run mypy (blocking)
        run: mypy core/ parsers/ formatforge/ --ignore-missing-imports

  lint-node:
    name: Bundle Syntax Check (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Syntax-check all bundle JS
        run: |
          for f in packages/dsh-formatforge/index.mjs \
                   packages/dsh-formatforge/lib/client.js \
                   packages/dsh-formatforge/tools/*.mjs \
                   packages/dsh-formatforge/services/*.mjs \
                   packages/dsh-formatforge/http/*.mjs; do
            node --check "$f"
          done
          echo "all bundle files OK"

      - name: Client module contract + drag + panel + ff_result contract (fake DOM/host)
        run: |
          node packages/dsh-formatforge/test-client-bundle.mjs
          node packages/dsh-formatforge/test-client-drag.mjs
          node packages/dsh-formatforge/test-client-panel.mjs
          node packages/dsh-formatforge/test-result-contract.mjs
          node packages/dsh-formatforge/test-plugin-boot.mjs

      - name: Protocol contract — CLI JSON shape (via stubbed runner e2e is local-only;
              here we verify version & formats against the installed Python)
        run: node packages/dsh-formatforge/test-manifest.mjs

  cli-e2e:
    name: CLI End-to-End (protocol JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: version / formats / translate protocol checks
        run: |
          python -m formatforge version | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['data']['name']=='dsh-formatforge'"
          python -m formatforge formats | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['data']['count']>20"
          printf 'hello forge\n' | python -m formatforge translate --stdin-text --format text | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and 'hello forge' in d['data']['content']"

      - name: Inbox index DB (init/index/query/stats) round-trip
        run: |
          export FF_HOME="$RUNNER_TEMP/ff-ci-home"
          mkdir -p "$FF_HOME/inbox"
          python -m formatforge inbox init | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['data']['schema_version']>=1"
          printf '付款条款：月结30天\n' > "$FF_HOME/inbox/合同2024.txt"
          python -m formatforge translate "$FF_HOME/inbox/合同2024.txt" --format markdown --output-file "$FF_HOME/inbox/合同2024.ff.md" > "$FF_HOME/inbox/合同2024.ff.json"
          python -m formatforge inbox index --artifact "$FF_HOME/inbox/合同2024.ff.json" | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and len(d['data']['indexed'])==1"
          python -m formatforge inbox query --q 付款条款 | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['data']['total_returned']==1, d"
          python -m formatforge inbox query --q 付款 | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['data']['search_mode']=='like', d"
          python -m formatforge inbox stats | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['data']['total']==1"

      - name: Read-only API + SSE contract (fake webServer/req/res)
        run: node packages/dsh-formatforge/test-api.mjs

      - name: Host HTTP contract (real node:http + 宿主语义复刻：两参调用 / prefix 匹配)
        run: node packages/dsh-formatforge/test-host-http.mjs

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit (static security scan)
        run: |
          bandit -r core/ parsers/ formatforge/ -f github -ll \
            || (echo "::warning::bandit found low/medium issues, human review advised")
