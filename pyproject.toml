[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-formatforge"
version = "3.0.0"
description = "FormatForge - 把任意文件格式锻造成 AI 可读的结构化数据（dsh 插件内核）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # === 数据模型 ===
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.1.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    # === 核心解析器（必需） ===
    "pdfplumber>=0.11.9,<0.12",
    "Pillow>=10.0.0,<12.0",
    "PyYAML>=6.0,<7.0",
    # === 主流 Office 解析器 ===
    "openpyxl>=3.1.0,<4.0",    # XLSX/XLSM
    "python-docx>=1.0.0,<2.0", # DOCX
    "python-pptx>=0.6.23,<2.0", # PPTX
    # === 编码检测 ===
    "chardet>=5.0.0,<6.0",
    # === 邮件解析 ===
    "extract-msg>=0.55.0,<1.0",  # Outlook .msg
    # === TOML 解析（3.11+ 用标准库 tomllib）===
    'tomli>=2.0,<3.0 ; python_version < "3.11"',
]

[project.optional-dependencies]
# === 开发工具 ===
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3.0",
    "mypy>=1.0",
]
# === PDF/OCR 增强（pdfplumber 之外的 PDF 库与 OCR 引擎） ===
ocr = [
    "pdfminer.six>=20240706",  # PDF 备用解析（pdfplumber 失败时）
    "pytesseract>=0.3.10",     # Tesseract OCR Python 绑定（系统需装 tesseract-ocr）
    "paddleocr>=2.7.0",        # PaddleOCR 中文识别（可选，慢）
    "easyocr>=1.7.0",          # EasyOCR（可选，慢）
]
# === 压缩格式扩展 ===
archive = [
    "py7zr>=0.21.0",  # .7z 支持
    "rarfile>=4.1",   # .rar 支持
]
# === 富文本格式 ===
richtext = [
    "striprtf>=0.0.26",  # .rtf 解析
]
# === 全部可选依赖 ===
all = [
    "pdfminer.six>=20240706",
    "pytesseract>=0.3.10",
    "py7zr>=0.21.0",
    "rarfile>=4.1",
    "striprtf>=0.0.26",
]

[tool.setuptools.packages.find]
# 显式声明 Python 包范围：避免 setuptools flat-layout 自动发现把
# frontend/（前端项目）、test/ 等误判为顶层包导致 editable 构建失败。
include = ["core*", "parsers*", "formatforge*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:httpx.*:",
]

[tool.ruff]
target-version = "py310"
line-length = 120
# 测试源码保持可追踪，但不作为生产源码的 lint/format 门禁对象。
extend-exclude = ["test"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[project.scripts]
formatforge = "formatforge.__main__:main"

[tool.ruff.lint.per-file-ignores]
# v1 数据模型的 camelCase 字段是公开 API 契约，重命名会破坏现有客户端。
"core/models.py" = ["N815"]

# test/ 目录全部放宽（fixture / 性能样板 / 防御性导入多）
"test/**/*.py" = ["B", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
# 默认参数中允许 FastAPI 工厂调用（与 per-file-ignores 互补）
extend-immutable-calls = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["test/"]
