[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "data-format-translator"
version = "1.0.0"
description = "AI 数据转换器 - 将各种文件格式转换为 AI 可识别的标准化数据"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "python-multipart==0.0.6",
    "openai==1.12.0",
    "python-pptx==0.6.23",
    "pypdf2==3.0.1",
    "pdfplumber==0.11.9",
    "pydantic==2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv==1.0.0",
    "httpx==0.26.0",
    "requests>=2.31.0",
    "Pillow==11.3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:httpx.*:",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"